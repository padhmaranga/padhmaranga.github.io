name: Check and deploy GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Resolve Pages paths
        shell: bash
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          if [[ "${name,,}" == "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$name" >> "$GITHUB_ENV"
          fi
          echo "NEXT_PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run verify:export
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check publication readiness
        if: github.event_name == 'workflow_dispatch'
        run: |
          if grep -qi 'name="robots" content="noindex' out/index.html; then
            echo "Confirm the identity and review the public content before publishing."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          path: out
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
